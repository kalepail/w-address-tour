[package]
name = "muxed-wallet"
version = "0.1.0"
edition = "2021"
publish = false
description = "A minimal smart wallet for Stellar. One contract address, many W (muxed contract) addresses, per CAP-84."
license = "Apache-2.0"

[lib]
crate-type = ["cdylib", "rlib"]
doctest = false

[dependencies]
soroban-sdk = "=30.0.0-rc.1"

[dev-dependencies]
soroban-sdk = { version = "=30.0.0-rc.1", features = ["testutils"] }
ed25519-dalek = { version = "2", features = ["rand_core"] }
rand = "0.8"

[profile.release]
opt-level = "z"
overflow-checks = true
debug = 0
strip = "symbols"
debug-assertions = false
panic = "abort"
codegen-units = 1
lto = true
